name: Daily Quant Scan

on:
  workflow_dispatch:

  schedule:
    # 08:20 UTC = 15:20 giờ Việt Nam
    - cron: "20 8 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-quant-scan
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Quant Bot
        run: python main.py

       - name: Save updated database
        if: always()
        run: |
          git config user.name "quant-bot"
          git config user.email "quant-bot@users.noreply.github.com"

          echo "Git status trước khi commit:"
          git status --short

          git add market.db

          if git diff --cached --quiet; then
            echo "market.db không thay đổi."
            exit 0
          fi

          git commit -m "Update market database $(date +'%Y-%m-%d')"

          # Không dùng git pull --rebase
          git push origin HEAD:main
          fi
