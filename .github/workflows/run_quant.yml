name: Run Quant VN100 Script

on:
  schedule:
   - cron: '30 16 * * 1-5'
   # 15:00 giờ VN (Thứ 2 - Thứ 6)
  workflow_dispatch:

jobs:
  run-quant:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6  # <-- Đã cập nhật lên v6 (Node 24 Native)
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas vnstock3

      - name: Run Screener Bot
        run: python quant_vn100.py
