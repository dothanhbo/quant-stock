name: Quant VN100 Daily Scan

on:
  schedule:
    # 14:45 giờ Việt Nam (UTC+7) = 07:45 UTC
    # Chạy từ Thứ 2 đến Thứ 6 hàng tuần
    - cron: '45 7 * * 1-5'
  workflow_dispatch: # Cho phép bấm nút chạy thủ công bất kỳ lúc nào

jobs:
  run-quant-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas vnstock

      - name: Run Quant VN100 Script
        run: |
          python quant_vn100.py
